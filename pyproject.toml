[project]
name = "rag-eval-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikhil Azad", email = "nikhilazad185@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepeval>=4.3.2",
    "dotenv>=0.9.9",
    "fastembed>=0.9.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "pydantic>=2.14.2",
    "pymupdf>=2.0",
    "streamlit>=1.66.1",
]

[project.scripts]
rag-eval-system = "rag_eval_system:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
